<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мини-карточка лида · CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --bg-elevated: #1a222c;
      --bg-input: #121820;
      --border: #2a3544;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d9a7a;
      --accent-hover: #4db390;
      --danger: #d45a5a;
      --warm: #c4873a;
      --cold: #5b8fc7;
      --radius: 10px;
      --font: "DM Sans", system-ui, sans-serif;
      --display: "Instrument Serif", Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #1a3a32 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 0%, #1e2a3a 0%, transparent 50%),
        var(--bg);
      padding: 2rem 1.25rem 4rem;
      line-height: 1.45;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.75rem;
    }

    header .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    header h1 {
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(1.85rem, 4vw, 2.35rem);
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.4rem;
    }

    /* —— ИНТЕРФЕЙС: форма —— */
    .panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.35rem 1.4rem 1.5rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    label .req { color: var(--danger); }

    input[type="text"],
    input[type="tel"],
    select {
      width: 100%;
      padding: 0.65rem 0.75rem;
      font: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }

    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr; }
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.65rem 0.75rem;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .toggle-row span {
      font-size: 0.9rem;
    }

    .switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .switch .slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .switch .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.15s;
    }

    .switch input:checked + .slider {
      background: var(--accent);
    }

    .switch input:checked + .slider::before {
      transform: translateX(20px);
    }

    .error {
      display: none;
      color: var(--danger);
      font-size: 0.85rem;
      margin-bottom: 0.85rem;
      padding: 0.55rem 0.7rem;
      background: rgba(212, 90, 90, 0.12);
      border-radius: 8px;
      border: 1px solid rgba(212, 90, 90, 0.35);
    }

    .error.visible { display: block; }

    button.primary {
      width: 100%;
      padding: 0.75rem 1rem;
      font: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      color: #0a1210;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button.primary:hover { background: var(--accent-hover); }
    button.primary:active { transform: scale(0.99); }

    /* —— Список лидов —— */
    .list-section {
      margin-top: 2rem;
    }

    .list-section h2 {
      font-family: var(--display);
      font-weight: 400;
      font-size: 1.45rem;
      margin-bottom: 0.85rem;
    }

    .empty {
      color: var(--muted);
      font-size: 0.9rem;
      padding: 1rem 0;
    }

    .lead-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      margin-bottom: 0.75rem;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .lead-card .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.65rem;
    }

    .lead-card .name {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .lead-card .phone {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.15rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      white-space: nowrap;
    }

    .badge.cold { background: rgba(91, 143, 199, 0.2); color: var(--cold); }
    .badge.warm { background: rgba(196, 135, 58, 0.2); color: var(--warm); }
    .badge.tz { background: rgba(61, 154, 122, 0.2); color: var(--accent); }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 1rem;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .meta strong { color: var(--text); font-weight: 500; }

    .stage-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .stage-row label {
      margin: 0;
      font-size: 0.75rem;
    }

    .stage-row select {
      width: auto;
      min-width: 180px;
      padding: 0.4rem 0.55rem;
      font-size: 0.82rem;
    }

    button.ghost {
      padding: 0.4rem 0.7rem;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }

    button.ghost:hover {
      border-color: var(--accent);
      color: var(--accent-hover);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Тестовое · CRM</div>
      <h1>Мини-карточка лида</h1>
      <p>Добавление лида с сохранением в браузере (localStorage).</p>
    </header>

    <!-- ========== ИНТЕРФЕЙС ========== -->
    <form class="panel" id="lead-form" novalidate>
      <div class="field">
        <label for="name">Имя клиента <span class="req">*</span></label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="Иван Иванов" />
      </div>

      <div class="field">
        <label for="phone">Номер телефона <span class="req">*</span></label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+7 (999) 123-45-67" />
      </div>

      <div class="row">
        <div class="field">
          <label for="source">Источник лида</label>
          <select id="source" name="source">
            <option value="Холодный">Холодный</option>
            <option value="Тёплый">Тёплый</option>
          </select>
        </div>
        <div class="field">
          <label for="assignee">Ответственный</label>
          <select id="assignee" name="assignee">
            <option value="Лидоруб">Лидоруб</option>
            <option value="МОП">МОП</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="stage">Этап сделки</label>
        <select id="stage" name="stage">
          <option value="Новый лид">Новый лид</option>
          <option value="Квалифицирован">Квалифицирован</option>
          <option value="Назначена консультация">Назначена консультация</option>
          <option value="Отказ">Отказ</option>
        </select>
      </div>

      <div class="toggle-row">
        <span>Запрошено ТЗ</span>
        <label class="switch" aria-label="Запрошено ТЗ">
          <input type="checkbox" id="tz-requested" name="tzRequested" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="error" id="form-error" role="alert"></div>

      <button type="submit" class="primary" id="save-btn">Сохранить</button>
    </form>

    <section class="list-section" aria-live="polite">
      <h2>Сохранённые лиды</h2>
      <div id="leads-list"></div>
    </section>
  </div>

  <script>
    /* ========== СОХРАНЕНИЕ ДАННЫХ ========== */
    const STORAGE_KEY = "crm_mini_leads";
    const STAGES = [
      "Новый лид",
      "Квалифицирован",
      "Назначена консультация",
      "Отказ",
    ];

    function loadLeads() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveLeads(leads) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(leads));
    }

    /* ========== ИНТЕРФЕЙС: отрисовка списка ========== */
    const listEl = document.getElementById("leads-list");

    function renderLeads(leads) {
      if (!leads.length) {
        listEl.innerHTML = '<p class="empty">Пока нет лидов. Заполните форму выше.</p>';
        return;
      }

      listEl.innerHTML = leads
        .map((lead) => {
          const sourceClass = lead.source === "Тёплый" ? "warm" : "cold";
          const tzBadge = lead.tzRequested
            ? '<span class="badge tz">Запрошено ТЗ</span>'
            : "";
          const stageOptions = STAGES.map(
            (s) =>
              `<option value="${s}" ${s === lead.stage ? "selected" : ""}>${s}</option>`
          ).join("");

          return `
            <article class="lead-card" data-id="${lead.id}">
              <div class="top">
                <div>
                  <div class="name">${escapeHtml(lead.name)}</div>
                  <div class="phone">${escapeHtml(lead.phone)}</div>
                </div>
                <div style="display:flex;gap:0.35rem;flex-wrap:wrap;justify-content:flex-end">
                  <span class="badge ${sourceClass}">${escapeHtml(lead.source)}</span>
                  ${tzBadge}
                </div>
              </div>
              <div class="meta">
                <span>Ответственный: <strong>${escapeHtml(lead.assignee)}</strong></span>
                <span>Этап: <strong>${escapeHtml(lead.stage)}</strong></span>
              </div>
              <div class="stage-row">
                <label for="stage-${lead.id}">Изменить этап</label>
                <select id="stage-${lead.id}" data-stage-select="${lead.id}">
                  ${stageOptions}
                </select>
              </div>
            </article>
          `;
        })
        .join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    /* ========== ЛОГИКА КНОПКИ «Сохранить» ========== */
    const form = document.getElementById("lead-form");
    const errorEl = document.getElementById("form-error");
    let leads = loadLeads();
    renderLeads(leads);

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const source = document.getElementById("source").value;
      const assignee = document.getElementById("assignee").value;
      const stage = document.getElementById("stage").value;
      const tzRequested = document.getElementById("tz-requested").checked;

      if (!name || !phone) {
        const missing = [];
        if (!name) missing.push("имя клиента");
        if (!phone) missing.push("номер телефона");
        errorEl.textContent = "Заполните обязательные поля: " + missing.join(" и ") + ".";
        errorEl.classList.add("visible");
        return;
      }

      errorEl.classList.remove("visible");
      errorEl.textContent = "";

      const lead = {
        id: "L-" + Date.now(),
        name,
        phone,
        source,
        assignee,
        stage,
        tzRequested,
        createdAt: new Date().toISOString(),
      };

      leads = [lead, ...leads];
      saveLeads(leads);
      renderLeads(leads);
      form.reset();
      document.getElementById("name").focus();
    });

    /* ========== ДОПОЛНИТЕЛЬНО: смена этапа сделки ========== */
    listEl.addEventListener("change", (e) => {
      const select = e.target.closest("[data-stage-select]");
      if (!select) return;

      const id = select.getAttribute("data-stage-select");
      const newStage = select.value;

      leads = leads.map((lead) =>
        lead.id === id ? { ...lead, stage: newStage } : lead
      );
      saveLeads(leads);
      renderLeads(leads);
    });
  </script>
</body>
</html>
